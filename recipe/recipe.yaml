schema_version: 1

context:
  name: e3x
  version: "1.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/e3x-${{ version }}.tar.gz
  sha256: 3538cd7ad3a98de023e5cda738fff172e7e8c10b381b9e0dbc9c16b88b0385cb

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - flit-core >=3.5,<4
    - pip
  run:
    - python >=${{ python_min }}
    - absl-py
    - etils
    - flax
    - jax
    - jaxtyping
    - more-itertools
    - numpy
    - sympy

tests:
  - python:
      imports:
        - e3x
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: JAX-Library for building E(3)-equivariant deep learning architectures based on Flax.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/google-research/e3x

extra:
  recipe-maintainers:
    - jan-janssen
